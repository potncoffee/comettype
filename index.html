<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet Letters</title>
<style>
  :root{
    --panel-bg: rgba(14,16,26,0.86);
    --panel-edge: rgba(255,255,255,0.10);
    --ink: #e8ecf4;
    --ink-dim: #9aa3b5;
    --accent: #7fd4ff;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060f;font-family:Arial,Helvetica,sans-serif;}
  #c{position:fixed;inset:0;display:block;cursor:grab;}
  #c.dragging{cursor:grabbing;}

  #panel{
    position:fixed;top:14px;left:14px;z-index:10;width:252px;
    max-height:calc(100vh - 28px);overflow-y:auto;overscroll-behavior:contain;
    background:var(--panel-bg);backdrop-filter:blur(8px);
    border:1px solid var(--panel-edge);border-radius:14px;
    color:var(--ink);padding:14px 16px 12px;box-shadow:0 8px 30px rgba(0,0,0,0.45);
    transition:transform .25s ease, opacity .25s ease;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.25) transparent;
  }
  #panel.hidden{transform:translateX(-110%);opacity:0;pointer-events:none;}
  #panelToggle{
    position:fixed;top:14px;left:14px;z-index:11;width:34px;height:34px;border-radius:10px;
    background:var(--panel-bg);border:1px solid var(--panel-edge);color:var(--ink);
    font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;
  }
  #panelToggle.show{display:flex;}

  h1{font-size:15px;margin:0 0 2px;font-weight:700;letter-spacing:.4px;}
  #tagline{font-size:11px;color:var(--ink-dim);margin:0 0 12px;line-height:1.35;}

  label{display:block;font-size:11px;color:var(--ink-dim);margin:10px 0 3px;letter-spacing:.3px;}
  .rowval{float:right;color:var(--accent);font-variant-numeric:tabular-nums;}

  input[type=text]{
    width:100%;box-sizing:border-box;background:rgba(255,255,255,0.07);
    border:1px solid var(--panel-edge);border-radius:8px;color:var(--ink);
    padding:8px 10px;font-size:15px;font-weight:700;letter-spacing:1px;outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  input[type=range]{width:100%;accent-color:var(--accent);height:18px;}
  select{
    width:100%;box-sizing:border-box;background:rgba(255,255,255,0.07);
    border:1px solid var(--panel-edge);border-radius:8px;color:var(--ink);
    padding:7px 8px;font-size:12px;outline:none;cursor:pointer;
  }
  select:focus{border-color:var(--accent);}
  select option{background:#14161f;color:var(--ink);}

  /* custom font dropdown: real DOM, so per-name font styling always renders */
  #fontBtn{
    width:100%;box-sizing:border-box;text-align:left;
    background:rgba(255,255,255,0.07);border:1px solid var(--panel-edge);
    border-radius:8px;color:var(--ink);padding:7px 10px;font-size:15px;cursor:pointer;
  }
  #fontBtn::after{content:" \25BE";color:var(--ink-dim);float:right;font-family:Arial,sans-serif;}
  #fontBtn:hover{border-color:var(--accent);}
  #fontMenu{
    display:none;margin-top:4px;max-height:280px;overflow-y:auto;
    background:#14161f;border:1px solid var(--panel-edge);border-radius:8px;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.25) transparent;
  }
  #fontMenu.open{display:block;}
  .fontOpt{
    padding:7px 10px;font-size:16px;color:var(--ink);cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .fontOpt:hover{background:rgba(127,212,255,0.14);}
  .fontOpt.sel{color:var(--accent);}

  .transRow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px;}
  .transRow label{margin:0;font-size:9px;color:var(--ink-dim);}
  .transRow input{accent-color:var(--accent);margin:0;width:12px;height:12px;}
  input[type=number]{
    width:100%;box-sizing:border-box;background:rgba(255,255,255,0.07);
    border:1px solid var(--panel-edge);border-radius:8px;color:var(--ink);
    padding:6px 8px;font-size:12px;outline:none;
  }
  input[type=number]:focus{border-color:var(--accent);}

  .colors{display:flex;gap:8px;margin-top:4px;}
  .colors > div{flex:1;text-align:center;}
  .colors label{margin:0 0 3px;}
  .swatch{
    width:100%;height:30px;border:2px solid var(--panel-edge);border-radius:8px;
    cursor:pointer;padding:0;display:block;
  }
  .swatch.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  #wheelWrap{margin-top:10px;text-align:center;}
  #wheel{width:170px;height:170px;cursor:crosshair;touch-action:none;}
  #wheelWrap label{text-align:left;}

  .checks{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;}
  .checks input{accent-color:var(--accent);}
  button.small{
    background:rgba(255,255,255,0.08);border:1px solid var(--panel-edge);color:var(--ink);
    border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer;
  }
  button.small:hover{border-color:var(--accent);color:var(--accent);}
  #hint{font-size:10px;color:var(--ink-dim);margin-top:12px;text-align:center;letter-spacing:.3px;}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="panelToggle" title="Show controls">☰</button>
<div id="panel">
  <h1>Comet Letters</h1>
  <p id="tagline"></p>

  <label>Text</label>
  <input type="text" id="txt" value="DYNAMIC TEXT" maxlength="40" spellcheck="false">

  <label>Font</label>
  <div id="fontPick">
    <button id="fontBtn" type="button"></button>
    <div id="fontMenu"></div>
  </div>

  <label>Depth <span class="rowval" id="depthV"></span></label>
  <input type="range" id="depth" min="10" max="500" step="2" value="170">

  <label>Letter spacing <span class="rowval" id="spacingV"></span></label>
  <input type="range" id="spacing" min="-80" max="240" step="2" value="0">

  <label>Font boldness <span class="rowval" id="weightV"></span></label>
  <input type="range" id="weight" min="-56" max="60" step="2" value="0">

  <label>Comet count <span class="rowval" id="countV"></span></label>
  <input type="range" id="count" min="40" max="1200" step="10" value="360">

  <label>Comet size <span class="rowval" id="sizeV"></span></label>
  <input type="range" id="size" min="0.5" max="8" step="0.1" value="2.6">

  <label>Comet speed <span class="rowval" id="speedV"></span></label>
  <input type="range" id="speed" min="0" max="8" step="0.1" value="2.2">

  <label>Tail length <span class="rowval" id="tailV"></span></label>
  <input type="range" id="tail" min="4" max="70" step="1" value="28">

  <label>Tail width <span class="rowval" id="tailWV"></span></label>
  <input type="range" id="tailW" min="0.2" max="8" step="0.1" value="1.8">

  <label>Tail fade <span class="rowval" id="fadeV"></span></label>
  <input type="range" id="fade" min="0" max="100" step="1" value="50">

  <label>Bounce chaos <span class="rowval" id="chaosV"></span></label>
  <input type="range" id="chaos" min="0" max="100" step="1" value="15">

  <label>Frame rate <span class="rowval" id="fpsV"></span></label>
  <input type="range" id="fps" min="5" max="50" step="1" value="50">

  <div class="colors">
    <div>
      <label>Comet</label><button class="swatch sel" id="sw-comet" title="Edit comet color"></button>
      <div class="transRow"><input type="checkbox" id="tr-comet"><label for="tr-comet">transparent</label></div>
    </div>
    <div>
      <label>Tail</label><button class="swatch" id="sw-tail" title="Edit tail color"></button>
      <div class="transRow"><input type="checkbox" id="tr-tail"><label for="tr-tail">transparent</label></div>
    </div>
    <div>
      <label>Background</label><button class="swatch" id="sw-bg" title="Edit background color"></button>
      <div class="transRow"><input type="checkbox" id="tr-bg"><label for="tr-bg">transparent</label></div>
    </div>
  </div>

  <div id="wheelWrap">
    <canvas id="wheel" width="180" height="180"></canvas>
    <label>Color density <span class="rowval" id="densV"></span></label>
    <input type="range" id="dens" min="0" max="100" step="1" value="55">
  </div>

  <div class="checks">
    <input type="checkbox" id="level" checked><label for="level" style="margin:0;color:var(--ink);font-size:12px;">Keep text level (360&deg; orbit stays level)</label>
  </div>

  <label>2D rotation <span class="rowval" id="rollV"></span></label>
  <input type="range" id="roll" min="-180" max="180" step="1" value="0">

  <label>Disk rotation (level spin) <span class="rowval" id="diskV"></span></label>
  <input type="range" id="disk" min="-180" max="180" step="1" value="0">

  <div class="checks">
    <input type="checkbox" id="orbit"><label for="orbit" style="margin:0;color:var(--ink);font-size:12px;">Slow auto-orbit</label>
  </div>

  <div class="checks">
    <input type="checkbox" id="loop"><label for="loop" style="margin:0;color:var(--ink);font-size:12px;">Loop mode (seamless)</label>
  </div>

  <label>Loop length <span class="rowval" id="loopLenV"></span></label>
  <input type="range" id="loopLen" min="1" max="15" step="0.5" value="3">

  <div class="footer">
    <button class="small" id="exportBtn">Export GIF&hellip;</button>
  </div>
  <div id="exportBox" style="display:none;">
    <div style="display:flex;gap:8px;">
      <div style="flex:1;"><label>Width px</label><input type="number" id="expW" min="16" step="1"></div>
      <div style="flex:1;"><label>Height px</label><input type="number" id="expH" min="16" step="1"></div>
      <div style="flex:0 0 70px;"><label>Margin px</label><input type="number" id="expM" min="0" step="1" value="2"></div>
    </div>
    <label>File name</label>
    <input type="text" id="expName" spellcheck="false" style="font-size:12px;font-weight:400;letter-spacing:0;">
    <div class="footer">
      <button class="small" id="renderGif">Render GIF</button>
      <span id="expStatus" style="font-size:10px;color:var(--ink-dim);"></span>
    </div>
  </div>

  <div class="footer">
    <button class="small" id="resetCam">Reset camera</button>
    <button class="small" id="hidePanel">Hide panel</button>
  </div>
  <div id="hint">drag to orbit &middot; scroll to zoom</div>
</div>

<script>
(function(){
"use strict";

/* ---------- rotating delight ---------- */
const TAGLINES = [
  "Tonight the alphabet is a sky.",
  "Every letter is a little universe with weather.",
  "The comets know the shape; they just never say it out loud.",
  "Invisible walls, visible wonder.",
  "Type something worth orbiting.",
  "Glyphs made of motion, nothing else.",
  "The font is Arial. The physics are yours.",
  "Somewhere in there, a comet is having a great day.",
  "Letters you can fly around.",
  "A word, kept by fireflies from space."
];
document.getElementById('tagline').textContent =
  TAGLINES[Math.floor(Math.random()*TAGLINES.length)];

/* ---------- state ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const panelEl = document.getElementById('panel');
let W=0, H=0, DPR=1;

/* the stage is the window minus the toolbar: letters center in what's visible */
function viewArea(){
  if(panelEl.classList.contains('hidden')) return {left:0, w:W};
  const r = panelEl.getBoundingClientRect();
  const left = Math.min(r.right + 12, W*0.6);   // never let the panel eat the whole stage
  return {left, w: W - left};
}

const S = {
  text: "DYNAMIC TEXT",
  font: "Liberation Sans",   // what "Arial Black" was silently mapping to anyway
  fps: 50,            // capped at 50: GIF delays are whole centiseconds, so 50 is the format max
  spacing: 0,         // extra px between letters; negative overlaps them
  weight: 0,          // px added to (+) or shaved off (-) the letter strokes
  depth: 170,
  speed: 2.2,
  count: 360,
  size: 2.6,          // comet diameter, world px (same unit as tail width)
  tailLen: 28,
  tailWidth: 1.8,     // tail width at the head end, world px; tapers conically to the tip
  fade: 50,           // how fast tail opacity falls toward the tip (0 slow, 100 fast)
  chaos: 15,          // 0 = perfect mirror bounces, 100 = near-random scatter
  cometColor: "#fff3c4",
  tailColor: "#6ec8ff",
  bgColor: "#05060f",
  cometTrans: false,  // transparency checkboxes: hide comet heads
  tailTrans: false,   // hide tails
  bgTrans: false,     // transparent background (live checkerboard; real alpha in GIF)
  loop: false,        // seamless loop mode
  loopLen: 3,         // loop length, seconds
  level: true,        // keep the wording on the level plane
  roll: 0,            // 2D screen rotation in degrees, + = clockwise
  disk: 0,            // turntable spin about the level vertical axis, degrees
  orbit: false
};

let yaw = 0, pitch = 0, userZoom = 1;        // boot straight-on: 0 means 0
const HOME = {yaw:0, pitch:0, zoom:1};
const PERSP = 1500;

/* ---------- letter mask ---------- */
/* Rasterize the text once; the alpha channel becomes the "inside a letter" test.
   Boldness: positive weight strokes the glyph outline on top (fatter),
   negative weight erases the outline band with destination-out (thinner). */
let mask = null;          // {w,h,data(Uint8),spawn:[i,...]}
let baseZoom = 1;

function buildMask(text){
  text = text.trim();
  if(!text) return;                       // keep last mask if emptied
  const fs = 300;
  const pad = 40 + Math.max(0, S.weight);
  const m = document.createElement('canvas');
  const mc = m.getContext('2d', {willReadFrequently:true});
  const fam = '"' + (S.font || 'Arial Black').replace(/"/g,'') + '"';
  const font = '900 '+fs+'px '+fam+', "Arial Black", Arial, sans-serif';
  mc.font = font;
  // place each glyph by hand so Letter spacing works in every browser
  const chars = [...text];
  const widths = chars.map(ch => mc.measureText(ch).width);
  const tw = Math.ceil(widths.reduce((a,b)=>a+b,0) + S.spacing*(chars.length-1));
  m.width  = Math.max(tw + pad*2, 60);
  m.height = Math.ceil(fs * 1.5) + Math.max(0, S.weight)*2;
  mc.font = font;                          // canvas resize clears font
  mc.textBaseline = 'middle';
  mc.lineJoin = 'round';
  mc.miterLimit = 2;
  mc.fillStyle = '#fff';
  mc.strokeStyle = '#fff';
  let gx = pad;
  for(let ci=0; ci<chars.length; ci++){
    mc.fillText(chars[ci], gx, m.height/2);
    if(S.weight > 0){
      mc.lineWidth = S.weight;
      mc.strokeText(chars[ci], gx, m.height/2);
    } else if(S.weight < 0){
      mc.globalCompositeOperation = 'destination-out';
      mc.lineWidth = -S.weight;
      mc.strokeText(chars[ci], gx, m.height/2);
      mc.globalCompositeOperation = 'source-over';
    }
    gx += widths[ci] + S.spacing;
  }

  const img = mc.getImageData(0,0,m.width,m.height).data;
  const data = new Uint8Array(m.width*m.height);
  const spawn = [];
  for(let i=0, p=0; i<data.length; i++, p+=4){
    if(img[p+3] > 120){ data[i] = 1; spawn.push(i); }
  }
  if(!spawn.length) return;                // eroded to nothing / only spaces: keep last mask
  mask = {w:m.width, h:m.height, data, spawn};
  fitZoom();
}

function fitZoom(){
  if(!mask) return;
  const va = viewArea();
  baseZoom = Math.min((va.w*0.82)/mask.w, (H*0.5)/mask.h);
}

function inside(x, y){
  const px = (x + mask.w/2) | 0;
  const py = (y + mask.h/2) | 0;
  if(px < 0 || py < 0 || px >= mask.w || py >= mask.h) return false;
  return mask.data[py*mask.w + px] === 1;
}

/* ---------- comets ---------- */
let comets = [];

/* Seedable PRNG. Loop mode re-runs each comet's cycle from the same seed, which
   is what makes the loop frame-exact: same seed + same steps = same bounces. */
function mulberry32(a){
  return function(){
    a|=0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14)>>>0) / 4294967296;
  };
}

function randomizeDirection(p, rnd){
  rnd = rnd || Math.random;
  // uniform random direction on the sphere, fresh magnitude
  const th = rnd()*Math.PI*2;
  const ph = Math.acos(2*rnd()-1);
  const v  = 0.6 + rnd()*0.8;
  p.vx = Math.sin(ph)*Math.cos(th)*v;
  p.vy = Math.sin(ph)*Math.sin(th)*v;
  p.vz = Math.cos(ph)*v;
}

function spawnComet(){
  const i = mask.spawn[(Math.random()*mask.spawn.length)|0];
  const p = {
    x: (i % mask.w) - mask.w/2 + Math.random(),
    y: ((i / mask.w)|0) - mask.h/2 + Math.random(),
    z: (Math.random()-0.5) * S.depth,
    vx:0, vy:0, vz:0,
    stuck: 0,
    trail: [],
    age: 0, seed: 0, start: null, rng: null
  };
  randomizeDirection(p);
  if(S.loop) enrollInLoop(p);
  return p;
}

/* loop mode: each comet repeats its own cycle of exactly loopLen seconds,
   phase-staggered so resets never happen all at once; a short fade at each
   comet's cycle edges hides its individual reset */
function enrollInLoop(p){
  p.seed  = (Math.random()*4294967296)>>>0;
  p.start = {x:p.x, y:p.y, z:p.z, vx:p.vx, vy:p.vy, vz:p.vz};
  p.age   = Math.random()*S.loopLen;
  p.rng   = mulberry32(p.seed);
}

function resetToStart(p){
  p.x=p.start.x; p.y=p.start.y; p.z=p.start.z;
  p.vx=p.start.vx; p.vy=p.start.vy; p.vz=p.start.vz;
  p.trail.length = 0; p.stuck = 0;
  p.rng = mulberry32(p.seed);          // same seed -> identical cycle every time
}

function initLoop(){
  for(const p of comets) enrollInLoop(p);
}

function loopEnvelope(p, Ls){
  const F = Math.max(0.15, Ls*0.1);    // fade window at each cycle edge
  return Math.max(0, Math.min(1, p.age/F, (Ls - p.age)/F));
}

function syncCount(){
  if(!mask) return;
  while(comets.length < S.count) comets.push(spawnComet());
  if(comets.length > S.count) comets.length = S.count;
}

function respawnAll(){
  comets = [];
  syncCount();
}

function jolt(p, rnd){
  // randomize the bounce angle; amplitude scales with the Bounce chaos slider
  // (relative to the comet's own speed, so fast and slow comets scatter alike)
  if(S.chaos <= 0) return;
  const m = Math.hypot(p.vx,p.vy,p.vz) || 1;
  const a = m * (S.chaos/100) * 2;
  p.vx += (rnd()-0.5)*a;
  p.vy += (rnd()-0.5)*a;
  p.vz += (rnd()-0.5)*a;
  const n = Math.hypot(p.vx,p.vy,p.vz) || 1;
  const k = m/n;
  p.vx*=k; p.vy*=k; p.vz*=k;
}

function updateComets(arr, dt, loopActive, Ls){
  if(!mask) return;
  const halfD = S.depth/2;
  // substeps scale with dt so big compensated steps at low fps can't tunnel through thin strokes
  const steps = Math.max(1, Math.ceil((S.speed*dt)/1.5));
  const s = (S.speed*dt)/steps;

  for(const p of arr){
    const rnd = p.rng || Math.random;   // seeded whenever the comet has a loop cycle, incl. export clones
    for(let k=0;k<steps;k++){
      let mx = p.vx*s, my = p.vy*s;
      // reflect each axis off the letter wall independently
      if(!inside(p.x + mx, p.y)){ p.vx = -p.vx; mx = -mx; jolt(p, rnd); }
      if(!inside(p.x, p.y + my)){ p.vy = -p.vy; my = -my; jolt(p, rnd); }
      // then take the best move still inside: full diagonal, else slide on one axis
      if(inside(p.x + mx, p.y + my)){ p.x += mx; p.y += my; p.stuck = 0; }
      else if(inside(p.x + mx, p.y)) { p.x += mx; p.vy = -p.vy; p.stuck = 0; }
      else if(inside(p.x, p.y + my)) { p.y += my; p.vx = -p.vx; p.stuck = 0; }
      else { p.vx = -p.vx; p.vy = -p.vy; p.stuck++; }  // wedged in a corner this step

      const nz = p.z + p.vz*s;
      if(nz < -halfD || nz > halfD) p.vz = -p.vz;
      p.z = Math.max(-halfD, Math.min(halfD, p.z + p.vz*s));
    }
    if(p.stuck > 20){ randomizeDirection(p, rnd); p.stuck = 0; }  // never leave a comet dead in place
    if(!inside(p.x, p.y)){                 // stranded (text/weight/depth changed under it)
      if(loopActive && p.start && inside(p.start.x, p.start.y)){
        resetToStart(p); p.age = 0;
      } else {
        const f = spawnComet();
        p.x=f.x; p.y=f.y; p.z=f.z; p.vx=f.vx; p.vy=f.vy; p.vz=f.vz; p.stuck=0;
        p.trail.length = 0;
        if(loopActive) enrollInLoop(p);
      }
    }
    p.trail.unshift({x:p.x, y:p.y, z:p.z});
    if(p.trail.length > S.tailLen) p.trail.length = S.tailLen;

    if(loopActive){
      p.age += dt*16.667/1000;           // dt is in 60fps frame units
      if(p.age >= Ls){ p.age -= Ls; resetToStart(p); }
    }
  }
}

/* ---------- rendering ---------- */
function hexToRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}

const P = {x:0,y:0,s:1};
let cy=1, sy=0, cp=1, sp=0, zoomNow=1, CX=0, CY=0, rollC=1, rollS=0;

function project(x, y, z, out){
  const X0 = x*cy + z*sy;
  let   Z  = -x*sy + z*cy;
  const Y0 = y*cp - Z*sp;
  Z        = y*sp + Z*cp;
  const per = PERSP/(PERSP + Z*zoomNow);
  // 2D roll happens last, in screen space: + is clockwise since screen y points down
  const dx = X0*zoomNow*per, dy = Y0*zoomNow*per;
  out.x = CX + dx*rollC - dy*rollS;
  out.y = CY + dx*rollS + dy*rollC;
  out.s = per;
  return out;
}

function rotZ(x, y, z){              // depth after rotation, for painter's sort
  const Z = -x*sy + z*cy;
  return y*sp + Z*cp;
}

function setCam(){
  const yawT = yaw + S.disk*Math.PI/180;   // disk spin: extra turn about the level (vertical) axis
  cy=Math.cos(yawT); sy=Math.sin(yawT);
  cp=Math.cos(pitch); sp=Math.sin(pitch);
  let rr;
  if(S.level){
    // true horizon lock: combined yaw+pitch slants the text baseline on screen
    // (world x-axis projects to y = sin(yaw)*sin(pitch)); cancel that slant with
    // a counter-roll each frame so the wording reads level at any orbit angle
    let slant = Math.atan2(sy*sp, cy);
    if(slant >  Math.PI/2) slant -= Math.PI;   // unwrap so the far side doesn't flip the view
    if(slant < -Math.PI/2) slant += Math.PI;
    rr = -slant;
  } else {
    rr = S.roll*Math.PI/180;
  }
  rollC = Math.cos(rr); rollS = Math.sin(rr);
}

let checkerPat = null;
function drawChecker(g, vw, vh){
  if(!checkerPat){
    const t = document.createElement('canvas'); t.width = t.height = 24;
    const tg = t.getContext('2d');
    tg.fillStyle = '#1d212c'; tg.fillRect(0,0,24,24);
    tg.fillStyle = '#272c3a'; tg.fillRect(0,0,12,12); tg.fillRect(12,12,12,12);
    checkerPat = g.createPattern(t,'repeat');
  }
  g.fillStyle = checkerPat; g.fillRect(0,0,vw,vh);
}

/* Paints one frame of the scene into any 2D context. The caller sets the
   camera (setCam) and the projection frame (zoomNow, CX, CY) first.
   loopLenSec > 0 applies each comet's loop fade envelope. */
function drawScene(g, vw, vh, arr, loopLenSec){
  if(S.bgTrans){
    g.clearRect(0,0,vw,vh);
    if(g === ctx) drawChecker(g, vw, vh);  // live hint only; exports keep real alpha
  } else {
    g.fillStyle = S.bgColor;
    g.fillRect(0,0,vw,vh);
  }
  if(!mask) return;

  // sort a throwaway copy for painter's order; sorting the live array in place
  // made count-trimming cull whole letters on one side of the screen
  const order = arr.slice().sort((a,b)=> rotZ(b.x,b.y,b.z) - rotZ(a.x,a.y,a.z));   // far first

  const [tr,tg,tb] = hexToRgb(S.tailColor);
  const [cr,cg,cb] = hexToRgb(S.cometColor);
  g.lineCap = 'round';
  const fadeK = 0.25 + (S.fade/100)*3.75;      // fade exponent: low = opaque long, high = fades fast

  let hx=0, hy=0, hs=1, px=0, py=0;
  for(const p of order){
    const t = p.trail, n = t.length;
    project(p.x, p.y, p.z, P); hx=P.x; hy=P.y; hs=P.s;

    g.globalAlpha = loopLenSec > 0 ? loopEnvelope(p, loopLenSec) : 1;

    // comet size and tail width share one unit: world px (diameter / width)
    const r = Math.max(0.6, S.size*hs*zoomNow*0.5);

    if(!S.tailTrans){
      // tail: conical taper (full width at head, point at tip); opacity falls off
      // by the Tail fade curve, from tail color at the head to transparent at the tip
      px = hx; py = hy;
      for(let i=1;i<n;i++){
        project(t[i].x, t[i].y, t[i].z, P);
        const f = 1 - i/n;                     // 1 near comet -> 0 at tip
        g.strokeStyle = 'rgba('+tr+','+tg+','+tb+','+(0.85*Math.pow(f,fadeK)).toFixed(3)+')';
        g.lineWidth = Math.max(0.3, S.tailWidth*P.s*zoomNow*f);
        g.beginPath(); g.moveTo(px,py); g.lineTo(P.x,P.y); g.stroke();
        px = P.x; py = P.y;
      }

      // tail wider than the comet: wrap the tail's head end around the comet so it
      // outlines the top, bottom, and front face, not just the trailing side
      const headHalfW = S.tailWidth*hs*zoomNow*0.5;
      if(n > 1 && headHalfW > r){
        g.fillStyle = 'rgba('+tr+','+tg+','+tb+',0.85)';
        g.beginPath(); g.arc(hx,hy,headHalfW,0,6.2832); g.fill();
      }
    }

    if(!S.cometTrans){
      // glow halo + comet head
      const gr = g.createRadialGradient(hx,hy,0, hx,hy, r*3.2);
      gr.addColorStop(0,'rgba('+cr+','+cg+','+cb+',0.55)');
      gr.addColorStop(1,'rgba('+cr+','+cg+','+cb+',0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(hx,hy,r*3.2,0,6.2832); g.fill();

      g.fillStyle = S.cometColor;
      g.beginPath(); g.arc(hx,hy,r,0,6.2832); g.fill();
    }
  }
  g.globalAlpha = 1;
}

function draw(){
  setCam();
  zoomNow = baseZoom*userZoom;
  const va = viewArea();
  CX = va.left + va.w/2;
  CY = H/2;
  drawScene(ctx, W, H, comets, S.loop ? S.loopLen : 0);
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const elapsed = now - last;
  if(elapsed < 1000/S.fps - 1) return;         // throttle to the Frame rate slider
  last = now;
  // dt compensates for skipped frames: lower fps = choppier, not slower
  const dt = Math.min(10, elapsed/16.667);
  if(S.orbit) yaw += 0.0035*dt;
  updateComets(comets, dt, S.loop, S.loopLen);
  draw();
}

/* Screen bounding box of the letter volume (8 projected corners) plus the
   glow/tail overhang, so no comet clips. The user margin is added on top,
   in OUTPUT pixels, equal on all four sides. */
function contentBBox(){
  setCam();
  zoomNow = baseZoom*userZoom;
  const va = viewArea();
  CX = va.left + va.w/2; CY = H/2;
  const hw = mask.w/2, hh = mask.h/2, hd = S.depth/2;
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  for(const sx of [-1,1]) for(const sy2 of [-1,1]) for(const sz of [-1,1]){
    project(hw*sx, hh*sy2, hd*sz, P);
    if(P.x<minX)minX=P.x; if(P.x>maxX)maxX=P.x;
    if(P.y<minY)minY=P.y; if(P.y>maxY)maxY=P.y;
  }
  const over = Math.max(S.size*0.5*3.2, S.tailWidth*0.5)*zoomNow;  // glow halo / tail wrap overhang
  return {x:minX-over, y:minY-over, w:(maxX-minX)+over*2, h:(maxY-minY)+over*2,
          liveCX:CX, liveCY:CY};
}

/* GIF89a encoder, written here so the file stays self-contained. */
function lzwEncode(pixels, minCodeSize){
  const clear = 1<<minCodeSize, eoi = clear+1;
  let codeSize = minCodeSize+1, next = eoi+1;
  let dict = new Map();
  const bytes = [];
  let cur = 0, curBits = 0;
  const emit = code=>{
    cur |= code<<curBits; curBits += codeSize;
    while(curBits >= 8){ bytes.push(cur & 255); cur >>>= 8; curBits -= 8; }
  };
  const reset = ()=>{ dict = new Map(); next = eoi+1; codeSize = minCodeSize+1; };
  // the decoder's table runs one entry behind the encoder's, so the code width
  // grows only after one more code is emitted at the old width
  const bumpIfPending = ()=>{ if(next === (1<<codeSize) && codeSize < 12) codeSize++; };
  emit(clear);
  let prefix = pixels[0];
  for(let i=1;i<pixels.length;i++){
    const k = pixels[i], key = prefix*256 + k;
    const hit = dict.get(key);
    if(hit !== undefined){ prefix = hit; continue; }
    emit(prefix);
    bumpIfPending();
    dict.set(key, next); next++;
    if(next === 4096){ emit(clear); reset(); }
    prefix = k;
  }
  emit(prefix);
  bumpIfPending();
  emit(eoi);
  if(curBits > 0) bytes.push(cur & 255);
  return bytes;
}

function exportGIF(){
  if(!mask) return;
  const ew = Math.max(16, Math.round(parseFloat($('expW').value) || 100));
  const eh = Math.max(16, Math.round(parseFloat($('expH').value) || 100));
  let fname = ($('expName').value.trim() || suggestName());
  if(!/\.gif$/i.test(fname)) fname += '.gif';
  const status = $('expStatus');
  // export at the Frame rate slider's setting; GIF delays are whole hundredths
  // of a second, so the format tops out at 50fps (delay 2)
  const delay = Math.max(2, Math.round(100/S.fps));
  const fps = 100/delay;                       // effective fps the GIF will really play at
  const Ls = S.loopLen;
  const N = Math.max(2, Math.round(fps*Ls));
  const stepDt = 60/fps;                       // sim dt per export frame, in frame units
  const mPx = expMargin();

  if(!S.loop){ S.loop = true; $('loop').checked = true; initLoop(); }

  // deterministic clones: re-derive every comet from its start state + seed with
  // fixed-size steps, so the captured period is exactly periodic
  const clones = comets.map(src=>{
    const c = { x:0,y:0,z:0, vx:0,vy:0,vz:0, stuck:0, trail:[],
                age:0, seed:src.seed, start:src.start, rng:null };
    resetToStart(c);
    return c;
  });
  status.textContent = 'pre-rolling…';
  for(let i=0;i<clones.length;i++){
    const c = clones[i];
    const preN = Math.round(((comets[i].age % Ls) + Ls) % Ls * fps);
    for(let k=0;k<preN;k++) updateComets([c], stepDt, false, 0);
    c.age = preN/fps;
  }

  const bb = expBB || contentBBox();
  const scale = Math.max(0.01, (ew - 2*mPx)/bb.w);   // content fills canvas minus the margin
  const ecan = document.createElement('canvas'); ecan.width = ew; ecan.height = eh;
  const eg = ecan.getContext('2d', {willReadFrequently:true});
  const transparent = S.bgTrans;

  // palette + per-frame encode state
  let palette = null, palR=null, palG=null, palB=null, nearCache=null, transIndex=0;
  const parts = [];
  const le16 = v=>[v&255, (v>>8)&255];

  function buildPalette(data){
    const count = new Map();
    for(let i=0;i<data.length;i+=4){
      if(transparent && data[i+3] < 128) continue;
      const key = ((data[i]>>3)<<10)|((data[i+1]>>3)<<5)|(data[i+2]>>3);
      count.set(key, (count.get(key)||0)+1);
    }
    const top = [...count.entries()].sort((a,b)=>b[1]-a[1]).slice(0, transparent?255:256);
    const n = Math.max(1, top.length);
    palR = new Uint8Array(256); palG = new Uint8Array(256); palB = new Uint8Array(256);
    for(let i=0;i<n;i++){
      const key = top[i][0];
      palR[i] = ((key>>10)&31)<<3 | 4;
      palG[i] = ((key>>5)&31)<<3 | 4;
      palB[i] = (key&31)<<3 | 4;
    }
    transIndex = 255;
    nearCache = new Int16Array(32768).fill(-1);
    palette = {n};
  }
  function mapPixel(r,g,b){
    const bucket = ((r>>3)<<10)|((g>>3)<<5)|(b>>3);
    let idx = nearCache[bucket];
    if(idx >= 0) return idx;
    let best = 0, bd = 1e9;
    for(let i=0;i<palette.n;i++){
      const d = (palR[i]-r)**2 + (palG[i]-g)**2 + (palB[i]-b)**2;
      if(d < bd){ bd = d; best = i; }
    }
    nearCache[bucket] = best;
    return best;
  }

  // header + screen descriptor + global palette + loop-forever extension
  function headerParts(){
    parts.push(Uint8Array.from([71,73,70,56,57,97, ...le16(ew), ...le16(eh), 0xF7, 0, 0]));
    const gct = new Uint8Array(256*3);
    for(let i=0;i<256;i++){ gct[i*3]=palR[i]; gct[i*3+1]=palG[i]; gct[i*3+2]=palB[i]; }
    parts.push(gct);
    parts.push(Uint8Array.from([0x21,0xFF,0x0B, 78,69,84,83,67,65,80,69,50,46,48, 3,1,0,0, 0]));
  }
  function framePart(indexed){
    const packed = transparent ? 0x09 : 0x04;   // disposal 2 + transp flag, else disposal 1
    parts.push(Uint8Array.from([0x21,0xF9,4, packed, ...le16(delay), transparent?transIndex:0, 0,
                                0x2C, 0,0,0,0, ...le16(ew), ...le16(eh), 0, 8]));
    const lzw = lzwEncode(indexed, 8);
    for(let i=0;i<lzw.length;i+=255){
      const chunk = lzw.slice(i, i+255);
      parts.push(Uint8Array.from([chunk.length, ...chunk]));
    }
    parts.push(Uint8Array.from([0]));
  }

  function renderFrame(){
    setCam();
    zoomNow = baseZoom*userZoom*scale;
    CX = ew/2 + (bb.liveCX - (bb.x + bb.w/2))*scale;
    CY = eh/2 + (bb.liveCY - (bb.y + bb.h/2))*scale;
    drawScene(eg, ew, eh, clones, Ls);
  }
  function stepClones(){
    updateComets(clones, stepDt, false, 0);
    for(const c of clones){
      c.age += 1/fps;
      if(c.age >= Ls - 1e-9){ c.age -= Ls; resetToStart(c); }
    }
  }

  let f = 0;
  function doFrame(){
    renderFrame();
    const data = eg.getImageData(0,0,ew,eh).data;
    if(!palette){ buildPalette(data); headerParts(); }
    const indexed = new Uint8Array(ew*eh);
    for(let i=0,px=0;i<data.length;i+=4,px++){
      indexed[px] = (transparent && data[i+3] < 128)
        ? transIndex
        : mapPixel(data[i], data[i+1], data[i+2]);
    }
    framePart(indexed);
    stepClones();
    f++;
    status.textContent = 'frame '+f+' / '+N;
    if(f < N){ setTimeout(doFrame, 0); }
    else {
      parts.push(Uint8Array.from([0x3B]));
      const blob = new Blob(parts, {type:'image/gif'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
      status.textContent = 'saved '+fname+' ('+(blob.size/1048576).toFixed(1)+' MB)';
    }
  }
  status.textContent = 'rendering…';
  setTimeout(doFrame, 0);
}
$('renderGif').addEventListener('click', exportGIF);

/* ---------- color wheel + density ---------- */
/* Wheel: angle = hue, radius = saturation. Density slider = how deep/dark the
   color is (0 airy pastel -> 100 near-black rich), i.e. HSL lightness inverted. */
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2;
  let h=0, s=0;
  if(mx!==mn){
    const d=mx-mn;
    s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    if(mx===r)      h=(g-b)/d + (g<b?6:0);
    else if(mx===g) h=(b-r)/d + 2;
    else            h=(r-g)/d + 4;
    h*=60;
  }
  return {h, s, l};
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360;
  const a=s*Math.min(l,1-l);
  const f=n=>{
    const k=(n+h/30)%12;
    const c=l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));
    return Math.round(c*255).toString(16).padStart(2,'0');
  };
  return '#'+f(0)+f(8)+f(4);
}

const wheel = $('wheel'), wctx = wheel.getContext('2d');
const WR = wheel.width/2;
let wheelBase = null;

function buildWheelBase(){
  const img = wctx.createImageData(wheel.width, wheel.height);
  const d = img.data;
  for(let y=0;y<wheel.height;y++){
    for(let x=0;x<wheel.width;x++){
      const dx=x-WR, dy=y-WR, r=Math.hypot(dx,dy);
      const i=(y*wheel.width+x)*4;
      if(r>WR){ d[i+3]=0; continue; }
      const hue=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
      const [R,G,B]=hexToRgb(hslToHex(hue, r/WR, 0.5));
      d[i]=R; d[i+1]=G; d[i+2]=B;
      d[i+3]= r>WR-1.5 ? Math.max(0, 255*(WR-r)/1.5) : 255;   // soft rim
    }
  }
  wheelBase = img;
}

const colorTargets = {
  comet:{key:'cometColor', sw:'sw-comet'},
  tail: {key:'tailColor',  sw:'sw-tail'},
  bg:   {key:'bgColor',    sw:'sw-bg'}
};
const colorState = {};
for(const t in colorTargets){
  const [r,g,b] = hexToRgb(S[colorTargets[t].key]);
  colorState[t] = rgbToHsl(r,g,b);
}
let activeTarget = 'comet';

const densToL = d => (90 - d*0.78)/100;     // density 0 -> 90% light, 100 -> 12%
const lToDens = l => Math.max(0, Math.min(100, Math.round((90 - l*100)/0.78)));

function drawWheel(){
  wctx.clearRect(0,0,wheel.width,wheel.height);
  wctx.putImageData(wheelBase,0,0);
  const c = colorState[activeTarget];
  const ang = c.h*Math.PI/180, rr = c.s*WR;
  const mx = WR + Math.cos(ang)*rr, my = WR + Math.sin(ang)*rr;
  wctx.beginPath(); wctx.arc(mx,my,7.5,0,6.2832);
  wctx.strokeStyle='rgba(0,0,0,0.65)'; wctx.lineWidth=4; wctx.stroke();
  wctx.beginPath(); wctx.arc(mx,my,7.5,0,6.2832);
  wctx.strokeStyle='#fff'; wctx.lineWidth=2; wctx.stroke();
}

function applyActiveColor(){
  const c = colorState[activeTarget];
  const hex = hslToHex(c.h, c.s, c.l);
  S[colorTargets[activeTarget].key] = hex;
  $(colorTargets[activeTarget].sw).style.background = hex;
}

function selectTarget(t){
  activeTarget = t;
  for(const k in colorTargets) $(colorTargets[k].sw).classList.toggle('sel', k===t);
  $('dens').value = lToDens(colorState[t].l);
  $('densV').textContent = $('dens').value;
  drawWheel();
}

for(const t in colorTargets){
  $(colorTargets[t].sw).style.background = S[colorTargets[t].key];
  $(colorTargets[t].sw).addEventListener('click', ()=> selectTarget(t));
}

function wheelPick(e){
  const rect = wheel.getBoundingClientRect();
  const dx = (e.clientX-rect.left)*(wheel.width/rect.width) - WR;
  const dy = (e.clientY-rect.top)*(wheel.height/rect.height) - WR;
  const c = colorState[activeTarget];
  c.h = (Math.atan2(dy,dx)*180/Math.PI+360)%360;
  c.s = Math.min(1, Math.hypot(dx,dy)/WR);
  applyActiveColor();
  drawWheel();
}
let wheelDown=false;
wheel.addEventListener('pointerdown', e=>{wheelDown=true; wheel.setPointerCapture(e.pointerId); wheelPick(e);});
wheel.addEventListener('pointermove', e=>{ if(wheelDown) wheelPick(e); });
wheel.addEventListener('pointerup',    ()=> wheelDown=false);
wheel.addEventListener('pointercancel',()=> wheelDown=false);

$('dens').addEventListener('input', ()=>{
  const d = parseInt($('dens').value,10);
  $('densV').textContent = d;
  colorState[activeTarget].l = densToL(d);
  applyActiveColor();
});

buildWheelBase();
selectTarget('comet');

let txtTimer=null;
$('txt').addEventListener('input', e=>{
  clearTimeout(txtTimer);
  txtTimer = setTimeout(()=>{
    S.text = e.target.value;
    buildMask(S.text);
    respawnAll();
  }, 250);
});

$('resetCam').addEventListener('click', ()=>{
  yaw=HOME.yaw; pitch=HOME.pitch; userZoom=HOME.zoom;
  S.roll = 0; S.level = true; S.disk = 0;
  $('roll').value = 0; $('rollV').textContent = '0°'; $('level').checked = true;
  $('disk').value = 0; $('diskV').textContent = '0°';
});
$('hidePanel').addEventListener('click', ()=>{
  $('panel').classList.add('hidden');
  $('panelToggle').classList.add('show');
  fitZoom();                               // re-center and refit to the full window
});
$('panelToggle').addEventListener('click', ()=>{
  $('panel').classList.remove('hidden');
  $('panelToggle').classList.remove('show');
  fitZoom();                               // refit to the stage right of the panel
});

/* ---------- resize / boot ---------- */
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  fitZoom();
}
window.addEventListener('resize', resize);

resize();
buildMask(S.text);
respawnAll();
requestAnimationFrame(frame);
})();
</script>
